[project]
name = "Agent-Smith"
version = "0.0.1"
description = "Code generator agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flake8",
    "mypy",
    "pydantic",
    "rich",
    "google-genai",
    "docker",
    "types-docker",
    "fire",
    "dotenv",
    "groq"
]

[dependency-groups]
dev = [
    "types-requests",
    "types-setuptools",
    "types-docopt",
]

[project.scripts]
sandbox = "src.__main__:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[[tool.mypy.overrides]]
module = "fire"
ignore_missing_imports = true
